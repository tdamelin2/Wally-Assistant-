<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button{font-family:inherit}
.course{background:#FFFFFF;border:1px solid #E4E7E1;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cn{font-size:16px;font-weight:500}
.cm{font-size:12px;color:#55605A}

.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.a{height:44px;border:1px solid #D5DBD3;border-radius:12px;background:#FFFFFF;color:#16201A;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

    <button role="tab" aria-selected="false" class="chip">Hardware</button>

    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
