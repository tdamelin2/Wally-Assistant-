<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laptop — Log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F4}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button,input{font-family:inherit;cursor:pointer}
.rl{width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#55605A;font-size:12px;font-weight:500;padding:6px 0}
.ri{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.chip{height:38px;padding:0 16px;border:1px solid #D5DBD3;border-radius:19px;background:#FFFFFF;color:#16201A;font-size:14px}
.on{border:0;background:#1F6F4A;color:#FFFFFF;font-weight:500}
.card{background:#FFFFFF;border:1px solid #E4E7E1;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 10px;border-radius:12px}
.ic{width:34px;height:34px;border-radius:17px;background:#DCEFE3;color:#0F3D27;display:flex;align-items:center;justify-content:center;flex:none}
.ct{width:30%;font-size:12px;color:#55605A}
.ct{width:auto}
.ib{width:34px;height:34px;border:0;border-radius:17px;background:transparent;color:#55605A;display:flex;align-items:center;justify-content:center}
.cat{height:64px;border:1px solid #D5DBD3;border-radius:14px;background:#FFFFFF;color:#16201A;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; display: flex; flex-wrap: wrap">

  <nav aria-label="Hubs" style="flex: 1 1 88px; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E4E7E1; padding: 20px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #1F6F4A; color: #FFFFFF; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px">W</span>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
    <a href="#" class="rl" aria-current="page" style="color: #16201A; font-weight: 700"><span class="ri" style="background: #DCEFE3; color: #0F3D27"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></span>Log</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
    <button aria-label="Sync now" title="Synced just now · click to sync" style="margin-top: auto; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #EFF2EE; color: #1F6F4A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 00-14.3-4.9L4 8"></path><path d="M4 3v5h5"></path><path d="M4 13a8 8 0 0014.3 4.9L20 16"></path><path d="M20 21v-5h-5"></path></svg></button>
  </nav>

  <div style="flex: 999 1 560px; min-width: 0; padding: 24px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div role="tablist" aria-label="Log type" style="display: flex; gap: 8px; flex-wrap: wrap">
      <button role="tab" aria-selected="false" class="chip">Check-ins</button>
      <button role="tab" aria-selected="true" class="chip on">Spending</button>
      <button role="tab" aria-selected="false" class="chip">Journal</button>
      <button role="tab" aria-selected="false" class="chip">Meals</button>
      <button role="tab" aria-selected="false" class="chip">Tasks</button>
      <button role="tab" aria-selected="false" class="chip">Dreams</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <div style="flex: 3 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <section class="card">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 14px; font-weight: 500; color: #55605A">This week</h2><span style="font-size: 26px; font-weight: 700">₪412</span></div>
          <div role="img" aria-label="This week by category" style="height: 12px; border-radius: 6px; overflow: hidden; display: flex; gap: 2px"><span style="width: 41%; background: #0F3D27"></span><span style="width: 29%; background: #1F6F4A"></span><span style="width: 18%; background: #4E9A73"></span><span style="width: 12%; background: #9CCBAE"></span></div>
          <div style="display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px"><span>■ Food ₪168</span><span style="color: #1F6F4A">■ <span style="color: #16201A">Shopping ₪120</span></span><span style="color: #4E9A73">■ <span style="color: #16201A">Transport ₪76</span></span><span style="color: #9CCBAE">■ <span style="color: #16201A">Bills ₪48</span></span></div>
        </section>

        <section class="card">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 16px; font-weight: 500">Today</h2><span style="font-size: 13px; color: #55605A">₪86</span></div>
          <div class="row"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 004 0V3M9 11v10"></path><path d="M17 3c-2 2-2 6 0 8v10"></path></svg></span><span style="flex: 1">Food <span class="ct">· [Note]</span></span><span style="font-weight: 500; width: 64px; text-align: right">₪48</span><span style="width: 72px"></span></div>
          <div class="row" style="background: #F6F7F4"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"></rect><path d="M5 11h14M8 21l1-4M16 21l-1-4"></path></svg></span><span style="flex: 1">Transport <span class="ct">· [Note]</span></span><span style="font-weight: 500; width: 64px; text-align: right">₪38</span><span style="display: flex; gap: 2px"><button class="ib" aria-label="Edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></button><button class="ib" aria-label="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button></span></div>
          <button style="align-self: flex-start; height: 38px; padding: 0 14px; border: 0; background: transparent; color: #1F6F4A; font-size: 14px; font-weight: 500">See all spending →</button>
        </section>
      </div>

      <aside aria-label="New spending" style="flex: 2 1 300px; min-width: 0; background: #FFFFFF; border: 1.5px solid #1F6F4A; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 18px; font-weight: 500">New spending</h2><span style="font-size: 12px; color: #55605A">Today · 11-11-2026</span></div>
        <label for="lamt" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #55605A">Amount<span style="display: flex; align-items: center; gap: 6px; height: 48px; border: 1px solid #1F6F4A; border-radius: 12px; padding: 0 12px"><span style="font-size: 18px; color: #55605A">₪</span><input id="lamt" value="48" style="flex: 1; border: 0; outline: none; font-size: 20px; color: #16201A; background: transparent"></span></label>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <button class="cat" style="border: 0; background: #1F6F4A; color: #FFFFFF; font-weight: 500">Food</button><button class="cat">Transport</button><button class="cat">Shopping</button><button class="cat">Bills</button><button class="cat">Fun</button><button class="cat">Health</button><button class="cat">Other</button>
        </div>
        <label for="lnote" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #55605A">Note (optional)<input id="lnote" placeholder="What was it?" style="height: 44px; border: 1px solid #D5DBD3; border-radius: 12px; padding: 0 12px; font-size: 14px; color: #16201A"></label>
        <div style="display: flex; gap: 10px; align-items: center">
          <button style="height: 44px; padding: 0 16px; border: 0; background: transparent; color: #55605A; font-size: 14px; font-weight: 500">Cancel <kbd style="font-family: inherit; font-size: 11px; color: #55605A">Esc</kbd></button>
          <button style="flex: 1; height: 44px; border: 0; border-radius: 22px; background: #1F6F4A; color: #FFFFFF; font-size: 15px; font-weight: 500">Save ₪48 · Food <kbd style="font-family: inherit; font-size: 11px; opacity: 0.8">Enter</kbd></button>
        </div>
      </aside>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
