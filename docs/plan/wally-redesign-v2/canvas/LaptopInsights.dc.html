<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laptop — Insights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F4}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button{font-family:inherit;cursor:pointer}
.rl{width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#55605A;font-size:12px;font-weight:500;padding:6px 0}
.ri{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.chip{height:38px;padding:0 16px;border:1px solid #D5DBD3;border-radius:19px;background:#FFFFFF;color:#16201A;font-size:14px}
.on{border:0;background:#1F6F4A;color:#FFFFFF;font-weight:500}
.card{background:#FFFFFF;border:1px solid #E4E7E1;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.h{margin:0;font-size:16px;font-weight:500}
.sub{font-size:12px;color:#55605A}
.hb{display:grid;grid-template-columns:80px 1fr 56px;align-items:center;gap:10px;font-size:13px}
.tr{height:10px;border-radius:5px;background:#EFF2EE;overflow:hidden;display:flex}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; display: flex; flex-wrap: wrap">

  <nav aria-label="Hubs" style="flex: 1 1 88px; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E4E7E1; padding: 20px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #1F6F4A; color: #FFFFFF; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px">W</span>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></span>Log</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" class="rl" aria-current="page" style="color: #16201A; font-weight: 700"><span class="ri" style="background: #DCEFE3; color: #0F3D27"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
    <button aria-label="Sync now" style="margin-top: auto; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #EFF2EE; color: #1F6F4A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 00-14.3-4.9L4 8"></path><path d="M4 3v5h5"></path><path d="M4 13a8 8 0 0014.3 4.9L20 16"></path><path d="M20 21v-5h-5"></path></svg></button>
  </nav>

  <div style="flex: 999 1 560px; min-width: 0; padding: 24px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div role="tablist" aria-label="Insights" style="display: flex; gap: 8px; flex-wrap: wrap">
      <button role="tab" aria-selected="true" class="chip on">Charts</button>
      <button role="tab" aria-selected="false" class="chip">Health</button>
      <button role="tab" aria-selected="false" class="chip">Screentime</button>
      <button role="tab" aria-selected="false" class="chip">Goals</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px">
      <section class="card">
        <div><h2 class="h">Check-ins</h2><span class="sub">Last 30 days · 1–5</span></div>
        <svg viewBox="0 0 480 140" width="100%" height="140" role="img" aria-label="Check-in scores over the last 30 days" preserveAspectRatio="none">
          <line x1="0" y1="20" x2="480" y2="20" stroke="#EFF2EE"></line><line x1="0" y1="70" x2="480" y2="70" stroke="#EFF2EE"></line><line x1="0" y1="120" x2="480" y2="120" stroke="#EFF2EE"></line>
          <polyline fill="none" stroke="#0F3D27" stroke-width="2.5" points="0,60 44,48 88,54 132,36 176,48 220,42 264,30 308,48 352,36 396,34 440,42 480,36"></polyline>
          <polyline fill="none" stroke="#4E9A73" stroke-width="2.5" points="0,72 44,66 88,78 132,60 176,72 220,66 264,54 308,72 352,60 396,58 440,66 480,62"></polyline>
          <polyline fill="none" stroke="#9CCBAE" stroke-width="2.5" stroke-dasharray="6 4" points="0,54 44,42 88,36 132,48 176,36 220,30 264,36 308,42 352,30 396,36 440,34 480,30"></polyline>
          <polyline fill="none" stroke="#55605A" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" points="0,96 44,102 88,90 132,108 176,96 220,102 264,110 308,94 352,106 396,108 440,102 480,106"></polyline>
        </svg>
        <div style="display: flex; gap: 14px; font-size: 12px; color: #33403A"><span>━ Mood</span><span style="color: #4E9A73">━ <span style="color: #33403A">Energy</span></span><span style="color: #9CCBAE">╍ <span style="color: #33403A">Sleep</span></span><span style="color: #55605A">┈ Stress</span></div>
      </section>

      <section class="card">
        <div><h2 class="h">Spending by category</h2><span class="sub">November</span></div>
        <div class="hb"><span>Food</span><span class="tr"><span style="width: 100%; background: #1F6F4A"></span></span><span style="text-align: right">₪520</span></div>
        <div class="hb"><span>Shopping</span><span class="tr"><span style="width: 62%; background: #1F6F4A"></span></span><span style="text-align: right">₪320</span></div>
        <div class="hb"><span>Transport</span><span class="tr"><span style="width: 38%; background: #1F6F4A"></span></span><span style="text-align: right">₪196</span></div>
        <div class="hb"><span>Bills</span><span class="tr"><span style="width: 24%; background: #1F6F4A"></span></span><span style="text-align: right">₪124</span></div>
        <div class="hb"><span>Fun</span><span class="tr"><span style="width: 14%; background: #1F6F4A"></span></span><span style="text-align: right">₪72</span></div>
      </section>

      <section class="card">
        <div><h2 class="h">Spending per month</h2><span class="sub">Last 6 months</span></div>
        <svg viewBox="0 0 480 120" width="100%" height="120" role="img" aria-label="Spending per month, last 6 months" preserveAspectRatio="none">
          <rect x="20" y="50" width="50" height="60" rx="6" fill="#9CCBAE"></rect><rect x="98" y="38" width="50" height="72" rx="6" fill="#9CCBAE"></rect><rect x="176" y="56" width="50" height="54" rx="6" fill="#9CCBAE"></rect><rect x="254" y="26" width="50" height="84" rx="6" fill="#9CCBAE"></rect><rect x="332" y="44" width="50" height="66" rx="6" fill="#9CCBAE"></rect><rect x="410" y="62" width="50" height="48" rx="6" fill="#1F6F4A"></rect>
        </svg>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); text-align: center; font-size: 12px; color: #55605A"><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span style="color: #16201A; font-weight: 700">Nov</span></div>
      </section>

      <section class="card">
        <div><h2 class="h">Tasks done per week</h2><span class="sub">Last 8 weeks</span></div>
        <svg viewBox="0 0 480 120" width="100%" height="120" role="img" aria-label="Tasks done per week, last 8 weeks" preserveAspectRatio="none">
          <rect x="10" y="60" width="40" height="50" rx="5" fill="#9CCBAE"></rect><rect x="70" y="40" width="40" height="70" rx="5" fill="#9CCBAE"></rect><rect x="130" y="70" width="40" height="40" rx="5" fill="#9CCBAE"></rect><rect x="190" y="30" width="40" height="80" rx="5" fill="#9CCBAE"></rect><rect x="250" y="50" width="40" height="60" rx="5" fill="#9CCBAE"></rect><rect x="310" y="44" width="40" height="66" rx="5" fill="#9CCBAE"></rect><rect x="370" y="36" width="40" height="74" rx="5" fill="#9CCBAE"></rect><rect x="430" y="56" width="40" height="54" rx="5" fill="#1F6F4A"></rect>
        </svg>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
