.hb{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:8px;font-size:13px}

.app{display:flex;align-items:center;gap:12px;font-size:14px}
.ai{width:32px;height:32px;border-radius:9px;background:#EFF2EE;flex:none}
.lab{font-size:11px;padding:2px 8px;border-radius:8px;background:#DCEFE3;color:#0F3D27}
.chip{flex:none;height:40px;padding:0 16px;border:1px solid #D5DBD3;border-radius:20px;background:#FFFFFF;color:#16201A;font-size:14px}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="h">Listening</h2><span class="sub">Spotify</span></div>
      <div class="app"><span class="ai" style="background: #DCEFE3"></span><span style="flex: 1; display: flex; flex-direction: column"><span>[Track]</span><span class="sub">[Artist] · 9:10 AM</span></span></div>
    </section>

    <button style="height: 48px; border: 0; background: transparent; color: #1F6F4A; font-size: 14px; font-weight: 500">Labels, rules and suggestions</button>

  <div role="tablist" aria-label="Insights" style="position: absolute; left: 0; right: 0; bottom: 80px; height: 60px; box-sizing: border-box; background: #F6F7F4; border-top: 1px solid #E4E7E1; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow: hidden">

    <button role="tab" aria-selected="true" class="chip" style="border: 0; background: #1F6F4A; color: #FFFFFF; font-weight: 500">Screentime</button>
