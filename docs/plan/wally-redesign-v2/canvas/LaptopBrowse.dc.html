<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laptop — Browse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F4}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button,input{font-family:inherit;cursor:pointer}
.rl{width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#55605A;font-size:12px;font-weight:500;padding:6px 0}
.ri{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.chip{height:38px;padding:0 16px;border:1px solid #D5DBD3;border-radius:19px;background:#FFFFFF;color:#16201A;font-size:14px}
.on{border:0;background:#1F6F4A;color:#FFFFFF;font-weight:500}
.fo{width:100%;height:40px;border:0;border-radius:10px;background:transparent;color:#16201A;font-size:14px;display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left}
.doc{width:100%;border:0;border-radius:12px;background:transparent;padding:10px 12px;box-sizing:border-box;text-align:left;color:#16201A;display:flex;flex-direction:column;gap:2px}
.dn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm{font-size:12px;color:#55605A}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; display: flex; flex-wrap: wrap">

  <nav aria-label="Hubs" style="flex: 1 1 88px; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E4E7E1; padding: 20px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #1F6F4A; color: #FFFFFF; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px">W</span>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></span>Log</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" class="rl" aria-current="page" style="color: #16201A; font-weight: 700"><span class="ri" style="background: #DCEFE3; color: #0F3D27"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
    <button aria-label="Sync now" style="margin-top: auto; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #EFF2EE; color: #1F6F4A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 00-14.3-4.9L4 8"></path><path d="M4 3v5h5"></path><path d="M4 13a8 8 0 0014.3 4.9L20 16"></path><path d="M20 21v-5h-5"></path></svg></button>
  </nav>

  <div style="flex: 999 1 560px; min-width: 0; padding: 24px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
      <div role="tablist" aria-label="Browse" style="display: flex; gap: 8px; flex-wrap: wrap">
        <button role="tab" aria-selected="true" class="chip on">Files</button>
        <button role="tab" aria-selected="false" class="chip">Study</button>
        <button role="tab" aria-selected="false" class="chip">Mail</button>
        <button role="tab" aria-selected="false" class="chip">Hardware</button>
        <button role="tab" aria-selected="false" class="chip">Settings</button>
      </div>
      <label for="lsearch" style="height: 40px; min-width: 260px; border: 1px solid #D5DBD3; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #55605A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input id="lsearch" placeholder="Search titles and text  (Ctrl+F)" aria-label="Search" style="flex: 1; border: 0; outline: none; font-size: 14px; background: transparent"></label>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
      <aside aria-label="Folders" style="flex: 1 1 180px; max-width: 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <button class="fo" style="background: #DCEFE3; color: #0F3D27; font-weight: 500">All docs</button>
        <button class="fo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"></path></svg>[Folder]</button>
        <button class="fo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"></path></svg>[Folder]</button>
        <button class="fo">No folder</button>
        <button class="fo" style="color: #1F6F4A; font-weight: 500">+ New folder</button>
        <button class="fo" style="margin-top: 12px; color: #1F6F4A; font-weight: 500">Approvals · 2</button>
      </aside>

      <section aria-label="Docs" style="flex: 1 1 260px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7E1; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <button style="height: 40px; border: 0; border-radius: 20px; background: #1F6F4A; color: #FFFFFF; font-size: 14px; font-weight: 500; margin-bottom: 6px">+ New doc</button>
        <button class="doc" style="background: #EFF2EE"><span class="dn">[Doc title]</span><span class="dm">[Folder] · edited today</span></button>
        <button class="doc"><span class="dn">[Doc title]</span><span class="dm">No folder · 11-08-2026</span></button>
        <button class="doc"><span class="dn">[Study guide made by Wally]</span><span class="dm">[Folder] · 11-06-2026</span></button>
        <button class="doc"><span class="dn">[Doc title]</span><span class="dm">[Folder] · 10-30-2026</span></button>
      </section>

      <article aria-label="Open doc" style="flex: 2 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E7E1; border-radius: 18px; padding: 22px 26px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
          <h2 style="margin: 0; font-size: 22px; font-weight: 500">[Doc title]</h2>
          <div style="display: flex; gap: 6px"><button style="height: 36px; padding: 0 14px; border: 1.5px solid #1F6F4A; border-radius: 18px; background: transparent; color: #1F6F4A; font-size: 13px; font-weight: 500">Edit</button><button aria-label="More: move, rename, delete" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: #EFF2EE; color: #16201A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button></div>
        </div>
        <span style="font-size: 12px; color: #55605A">[Folder] · edited today</span>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #33403A">[The doc's text shows here as a preview. On the laptop you read it next to the list, so you can click through docs without opening and closing each one.]</p>
      </article>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
