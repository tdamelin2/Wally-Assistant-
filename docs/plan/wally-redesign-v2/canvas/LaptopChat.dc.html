<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laptop — Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F4}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button,textarea{font-family:inherit;cursor:pointer}
.rl{width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#55605A;font-size:12px;font-weight:500;padding:6px 0}
.ri{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.c{width:100%;border:0;border-radius:12px;background:transparent;padding:10px 12px;box-sizing:border-box;text-align:left;color:#16201A;display:flex;flex-direction:column;gap:2px}
.ct{display:flex;justify-content:space-between;gap:8px}
.n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{flex:none;font-size:11px;color:#55605A}
.pv{font-size:12px;color:#55605A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{align-self:flex-end;max-width:62%;background:#1F6F4A;color:#FFFFFF;padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.45}
.bub{align-self:flex-start;max-width:62%;background:#FFFFFF;border:1px solid #E4E7E1;padding:10px 14px;border-radius:18px 18px 18px 4px;font-size:15px;line-height:1.45}
.pick{height:38px;padding:0 14px;border:1.5px solid #1F6F4A;border-radius:19px;background:#FFFFFF;color:#0F3D27;font-size:14px;font-weight:500}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; display: flex; flex-wrap: wrap">

  <nav aria-label="Hubs" style="flex: 1 1 88px; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E4E7E1; padding: 20px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #1F6F4A; color: #FFFFFF; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px">W</span>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></span>Log</a>
    <a href="#" class="rl" aria-current="page" style="color: #16201A; font-weight: 700"><span class="ri" style="background: #DCEFE3; color: #0F3D27"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" class="rl"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
    <button aria-label="Sync now" style="margin-top: auto; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #EFF2EE; color: #1F6F4A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 00-14.3-4.9L4 8"></path><path d="M4 3v5h5"></path><path d="M4 13a8 8 0 0014.3 4.9L20 16"></path><path d="M20 21v-5h-5"></path></svg></button>
  </nav>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-wrap: wrap">
    <aside aria-label="Chats" style="flex: 1 1 260px; max-width: 100%; box-sizing: border-box; border-right: 1px solid #E4E7E1; padding: 20px 12px; display: flex; flex-direction: column; gap: 6px; background: #FBFCFA">
      <div style="display: flex; align-items: center; gap: 6px; padding: 0 0 6px 6px"><h1 style="margin: 0; font-size: 20px; font-weight: 500">Chats</h1><span style="flex: 1; font-size: 12px; color: #55605A">6 of 10</span><button aria-label="Hide chats" title="Hide chats (Ctrl+B)" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; color: #55605A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16M15 10l-2 2 2 2"></path></svg></button></div>
      <button style="height: 42px; border: 0; border-radius: 21px; background: #1F6F4A; color: #FFFFFF; font-size: 14px; font-weight: 500; margin-bottom: 6px">+ New chat</button>
      <button class="c"><span class="ct"><span class="n" style="display: flex; align-items: center; gap: 6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="#1F6F4A" aria-label="Pinned"><path d="M15 3l6 6-4 1-4 4 1 5-2 2-4-6-6 6v-2l5-5-6-4 2-2 5 1 4-4z"></path></svg>Weekly report</span><span class="tm">Sun</span></span><span class="pv">[Last week in a few lines…]</span></button>
      <button class="c" style="background: #DCEFE3"><span class="ct"><span class="n">[Chat name]</span><span class="tm">Now</span></span><span class="pv">You have two calculus courses…</span></button>
      <button class="c"><span class="ct"><span class="n">[Chat name]</span><span class="tm">Yesterday</span></span><span class="pv">[Last message…]</span></button>
      <button class="c"><span class="ct"><span class="n">[Chat name]</span><span class="tm">Mon</span></span><span class="pv">[Last message…]</span></button>
      <button class="c"><span class="ct"><span class="n">[Chat name]</span><span class="tm">11-06-2026</span></span><span class="pv">[Last message…]</span></button>
      <button style="margin-top: auto; height: 40px; border: 0; background: transparent; color: #1F6F4A; font-size: 14px; font-weight: 500">Memory</button>
    </aside>

    <section aria-label="Conversation" style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; min-height: 800px">
      <header style="padding: 20px 28px 14px 28px; border-bottom: 1px solid #E4E7E1"><h2 style="margin: 0; font-size: 18px; font-weight: 500">[Chat name]</h2></header>
      <div style="flex: 1; padding: 20px 28px; display: flex; flex-direction: column; gap: 12px">
        <div class="me">add task buy milk</div>
        <div style="align-self: flex-start; display: flex; flex-direction: column; gap: 8px; max-width: 62%">
          <div class="bub" style="max-width: none">Done — "buy milk" is on your list for today.</div>
          <div style="display: flex; align-items: center; gap: 10px"><button style="height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: #16201A; color: #FFFFFF; font-size: 13px; font-weight: 500">Undo</button><span style="font-size: 12px; color: #55605A">24 s</span></div>
        </div>
        <div class="me">make a study guide on calculus</div>
        <div style="align-self: flex-start; display: flex; flex-direction: column; gap: 8px; max-width: 62%">
          <div class="bub" style="max-width: none">You have two calculus courses. Which one?</div>
          <div style="display: flex; gap: 8px"><button class="pick">[Calculus I]</button><button class="pick">[Calculus II]</button></div>
        </div>
      </div>
      <form style="margin: 0 28px 24px 28px; min-height: 56px; background: #FFFFFF; border: 1px solid #D5DBD3; border-radius: 28px; display: flex; align-items: center; padding: 4px 6px 4px 20px; gap: 8px">
        <label for="lmsg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message Wally</label>
        <textarea id="lmsg" rows="1" placeholder="Message Wally…  (Enter to send, Shift+Enter for a new line)" style="flex: 1; border: 0; outline: none; resize: none; font-size: 15px; color: #16201A; background: transparent; padding: 10px 0"></textarea>
        <button type="submit" aria-label="Send" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1F6F4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
      </form>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
