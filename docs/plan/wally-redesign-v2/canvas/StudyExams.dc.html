<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Study — all exams</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button{font-family:inherit}
.h{margin:0;padding:0 4px;font-size:13px;font-weight:500;color:#55605A}
.box{background:#FFFFFF;border:1px solid #E4E7E1;border-radius:16px;overflow:hidden}
.ex{width:100%;border:0;border-bottom:1px solid #E4E7E1;background:transparent;padding:12px 14px;box-sizing:border-box;text-align:left;color:#16201A;display:flex;align-items:center;gap:12px}
.cd{flex:none;width:56px;height:56px;border-radius:14px;background:#DCEFE3;color:#0F3D27;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd b{font-size:20px;line-height:1}
.cd span{font-size:11px}
.et{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.en{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em{font-size:12px;color:#55605A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="padding: 20px 8px 8px 4px; display: flex; align-items: center; gap: 4px">
    <button aria-label="Back to study" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #16201A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 500">All exams</h1>
  </header>

  <main style="padding: 4px 16px 100px 16px; display: flex; flex-direction: column; gap: 10px">
    <h2 class="h">Upcoming · 3</h2>
    <div class="box">
      <button class="ex"><span class="cd" style="background: #1F6F4A; color: #FFFFFF"><b>5</b><span>days</span></span><span class="et"><span class="en">[Exam title]</span><span class="em">[Course] · Mon, Nov 16 · 9:00 AM</span></span></button>
      <button class="ex"><span class="cd"><b>12</b><span>days</span></span><span class="et"><span class="en">[Exam title]</span><span class="em">[Course] · Mon, Nov 23</span></span></button>
      <button class="ex" style="border-bottom: 0"><span class="cd"><b>30</b><span>days</span></span><span class="et"><span class="en">[Exam title]</span><span class="em">No course · Fri, Dec 11 · 2:00 PM</span></span></button>
    </div>

    <h2 class="h" style="padding-top: 6px">Past</h2>
    <div class="box">
      <button class="ex" style="border-bottom: 0"><span class="cd" style="background: #EFF2EE; color: #55605A"><b style="font-size: 14px">Done</b></span><span class="et"><span class="en" style="color: #55605A">[Exam title]</span><span class="em">[Course] · Oct 20</span></span></button>
    </div>

    <p style="margin: 0 4px; font-size: 12px; color: #55605A">Tap to edit · swipe left to delete</p>
  </main>

  <button style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 52px; border: 0; border-radius: 26px; background: #1F6F4A; color: #FFFFFF; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(22,32,26,0.2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add exam</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
