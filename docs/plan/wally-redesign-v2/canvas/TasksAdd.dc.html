<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button,input{font-family:inherit}
.dc{height:40px;padding:0 14px;border:1px solid #D5DBD3;border-radius:20px;background:#FFFFFF;color:#16201A;font-size:14px;display:flex;align-items:center;gap:6px}
.on{border:0;background:#1F6F4A;color:#FFFFFF;font-weight:500}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(22,32,26,0.45)"></div>

  <section role="dialog" aria-label="New task" style="position: absolute; left: 0; right: 0; bottom: 0; top: 400px; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 20px 24px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFD6CD"></span>
    <h2 style="margin: 0; font-size: 20px; font-weight: 500">New task</h2>

    <label for="t-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Task title</label>
    <input id="t-title" placeholder="What needs doing?" style="height: 52px; border: 1px solid #D5DBD3; border-radius: 14px; padding: 0 14px; font-size: 16px; color: #16201A; background: #FFFFFF">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #55605A">Due</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button class="dc on" aria-pressed="true">None</button>
        <button class="dc">Today</button>
        <button class="dc">Tomorrow</button>
        <button class="dc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Pick date</button>
      </div>
    </div>


    <div style="margin-top: auto; display: flex; gap: 10px">
      <button style="height: 52px; padding: 0 20px; border: 0; border-radius: 26px; background: transparent; color: #55605A; font-size: 15px; font-weight: 500">Cancel</button>
      <button style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: #1F6F4A; color: #FFFFFF; font-size: 16px; font-weight: 500">Save task</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
