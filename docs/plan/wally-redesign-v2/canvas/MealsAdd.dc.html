<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New meal or snack</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button,textarea{font-family:inherit}
.pick{flex:1;height:48px;border:1px solid #D5DBD3;border-radius:14px;background:#FFFFFF;color:#16201A;font-size:15px;display:flex;align-items:center;gap:8px;padding:0 14px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(22,32,26,0.45)"></div>

  <section role="dialog" aria-label="New meal or snack" style="position: absolute; left: 0; right: 0; bottom: 0; top: 200px; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 20px 24px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFD6CD"></span>
    <h2 style="margin: 0; font-size: 20px; font-weight: 500">New meal</h2>

    <div role="radiogroup" aria-label="Type" style="height: 44px; box-sizing: border-box; border: 1px solid #D5DBD3; border-radius: 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; gap: 3px">
      <button role="radio" aria-checked="true" style="border: 0; border-radius: 19px; background: #1F6F4A; color: #FFFFFF; font-size: 14px; font-weight: 500">Meal</button>
      <button role="radio" aria-checked="false" style="border: 0; border-radius: 19px; background: transparent; color: #55605A; font-size: 14px">Snack</button>
    </div>

    <label for="m-what" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #55605A">What did you eat?
      <textarea id="m-what" rows="3" placeholder="e.g. two eggs, toast, coffee with milk" style="border: 1px solid #D5DBD3; border-radius: 14px; padding: 12px; font-size: 15px; color: #16201A; resize: none; background: #FFFFFF"></textarea>
    </label>

    <div style="display: flex; gap: 10px">
      <button class="pick" aria-label="Date, today"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55605A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Today</button>
      <button class="pick" aria-label="Time, 7:45 PM"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55605A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>7:45 PM</button>
    </div>

    <p style="margin: 0; font-size: 13px; color: #55605A; display: flex; gap: 8px; align-items: flex-start"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Calories, protein, carbs and fat are estimated automatically after you save.</p>

    <div style="margin-top: auto; display: flex; gap: 10px">
      <button style="height: 52px; padding: 0 20px; border: 0; border-radius: 26px; background: transparent; color: #55605A; font-size: 15px; font-weight: 500">Cancel</button>
      <button style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: #1F6F4A; color: #FFFFFF; font-size: 16px; font-weight: 500">Save meal</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
