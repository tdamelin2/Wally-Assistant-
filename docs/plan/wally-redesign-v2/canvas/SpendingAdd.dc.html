<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New spending</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button,input{font-family:inherit}
.ct{height:76px;border:1px solid #D5DBD3;border-radius:16px;background:#FFFFFF;color:#16201A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px}
.on{border:0;background:#1F6F4A;color:#FFFFFF;font-weight:500}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(22,32,26,0.45)"></div>

  <section role="dialog" aria-label="New spending" style="position: absolute; left: 0; right: 0; bottom: 0; top: 96px; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 20px 24px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFD6CD"></span>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 20px; font-weight: 500">New spending</h2>
      <button style="height: 36px; padding: 0 12px; border: 1px solid #D5DBD3; border-radius: 18px; background: #FFFFFF; color: #16201A; font-size: 13px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Today</button>
    </div>

    <label for="sp-amt" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 4px 0">
      <span style="font-size: 13px; color: #55605A">Amount</span>
      <span style="display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid #1F6F4A; padding: 0 8px 4px 8px"><span style="font-size: 32px; color: #55605A">₪</span><input id="sp-amt" inputmode="decimal" value="48" style="width: 120px; border: 0; outline: none; font-size: 44px; font-weight: 500; color: #16201A; text-align: center; background: transparent"></span>
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #55605A">Category</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button class="ct on" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 004 0V3M9 11v10"></path><path d="M17 3c-2 2-2 6 0 8v10"></path></svg>Food</button>
        <button class="ct"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"></rect><path d="M5 11h14M8 21l1-4M16 21l-1-4"></path></svg>Transport</button>
        <button class="ct"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 016 0"></path></svg>Shopping</button>
        <button class="ct"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Bills</button>
        <button class="ct"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>Fun</button>
        <button class="ct"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"></path></svg>Health</button>
        <button class="ct"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle></svg>Other</button>
      </div>
    </div>

    <label for="sp-note" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #55605A">Note (optional)
      <input id="sp-note" placeholder="What was it?" style="height: 48px; border: 1px solid #D5DBD3; border-radius: 14px; padding: 0 12px; font-size: 15px; color: #16201A; background: #FFFFFF">
    </label>

    <div style="margin-top: auto; display: flex; gap: 10px">
      <button style="height: 52px; padding: 0 20px; border: 0; border-radius: 26px; background: transparent; color: #55605A; font-size: 15px; font-weight: 500">Cancel</button>
      <button style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: #1F6F4A; color: #FFFFFF; font-size: 16px; font-weight: 500">Save ₪48 · Food</button>
    </div>
  </section>
</div>
</x-dc>

}

</body>
</html>
