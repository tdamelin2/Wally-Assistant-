      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #55605A">Mood</span><span style="display: flex; gap: 3px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span></span></div>
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #55605A">Energy</span><span style="display: flex; gap: 3px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span></span></div>
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #55605A">Sleep</span><span style="display: flex; gap: 3px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span></span></div>
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #55605A">Stress</span><span style="display: flex; gap: 3px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span></span></div>
      </div>
      <p style="margin: 0; font-size: 14px; color: #33403A">[Check-in note]</p>
    </article>

    <article style="background: #FFFFFF; border: 1px solid #E4E7E1; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 16px; font-weight: 500">Yesterday</h2><span style="font-size: 12px; color: #55605A">Nov 10</span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #55605A">Mood</span><span style="display: flex; gap: 3px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span></span></div>
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #55605A">Energy</span><span style="display: flex; gap: 3px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span></span></div>
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #55605A">Sleep</span><span style="display: flex; gap: 3px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span></span></div>
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #55605A">Stress</span><span style="display: flex; gap: 3px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1F6F4A"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #DCE3DA"></span></span></div>

  </main>

  <button aria-label="Add a check-in" style="position: absolute; right: 16px; bottom: 156px; width: 56px; height: 56px; border: 0; border-radius: 18px; background: #1F6F4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22,32,26,0.25)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>

  <div role="tablist" aria-label="Log type" style="position: absolute; left: 0; right: 0; bottom: 80px; height: 60px; box-sizing: border-box; background: #F6F7F4; border-top: 1px solid #E4E7E1; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow: hidden">
    <button role="tab" aria-selected="true" style="flex: none; height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #1F6F4A; color: #FFFFFF; font-size: 14px; font-weight: 500">Check-ins</button>

    <button role="tab" aria-selected="false" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #D5DBD3; border-radius: 20px; background: #FFFFFF; color: #16201A; font-size: 14px">Journal</button>
    <button role="tab" aria-selected="false" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #D5DBD3; border-radius: 20px; background: #FFFFFF; color: #16201A; font-size: 14px">Meals</button>
    <button role="tab" aria-selected="false" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #D5DBD3; border-radius: 20px; background: #FFFFFF; color: #16201A; font-size: 14px">Tasks</button>
  </div>

  <nav aria-label="Hubs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E4E7E1; display: flex; justify-content: space-around; align-items: center; padding: 0 4px">
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>

    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
  </nav>
</div>
