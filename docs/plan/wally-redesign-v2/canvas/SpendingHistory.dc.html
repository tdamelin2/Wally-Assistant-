<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spending history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button{font-family:inherit}
.row{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;box-sizing:border-box;border-bottom:1px solid #E4E7E1;text-align:left;color:#16201A}
.ic{width:32px;height:32px;flex:none;border-radius:16px;background:#DCEFE3;color:#0F3D27;display:flex;align-items:center;justify-content:center}
.tx{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.cat{font-size:14px}
.nt{font-size:12px;color:#55605A}
.amt{font-size:15px;font-weight:500}
.day{display:flex;justify-content:space-between;padding:0 4px;font-size:13px;color:#55605A}
.box{background:#FFFFFF;border:1px solid #E4E7E1;border-radius:16px;overflow:hidden}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="padding: 20px 8px 8px 4px; display: flex; align-items: center; gap: 4px">
    <button aria-label="Back to spending" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #16201A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 500">Spending history</h1>
    <button style="height: 36px; padding: 0 12px; border: 1px solid #D5DBD3; border-radius: 18px; background: #FFFFFF; color: #16201A; font-size: 13px; display: flex; align-items: center; gap: 4px">November<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
  </header>

  <main style="padding: 4px 16px 96px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #DCEFE3; border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; color: #0F3D27">
      <span style="font-size: 14px">November so far</span><span style="font-size: 22px; font-weight: 700">₪1,240</span>
    </div>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <div class="day"><span>Yesterday · Tue, Nov 10</span><span style="font-weight: 500; color: #16201A">₪164</span></div>
      <div class="box">
        <button class="row"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 016 0"></path></svg></span><span class="tx"><span class="cat">Shopping</span><span class="nt">[Note]</span></span><span class="amt">₪120</span></button>
        <button class="row" style="border-bottom: 0"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 004 0V3M9 11v10"></path><path d="M17 3c-2 2-2 6 0 8v10"></path></svg></span><span class="tx"><span class="cat">Food</span><span class="nt">[Note]</span></span><span class="amt">₪44</span></button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <div class="day"><span>Mon, Nov 9</span><span style="font-weight: 500; color: #16201A">₪98</span></div>
      <div class="box">
        <button class="row"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></span><span class="tx"><span class="cat">Bills</span><span class="nt">[Note]</span></span><span class="amt">₪48</span></button>
        <button class="row"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"></rect><path d="M5 11h14M8 21l1-4M16 21l-1-4"></path></svg></span><span class="tx"><span class="cat">Transport</span><span class="nt">[Note]</span></span><span class="amt">₪38</span></button>
        <button class="row" style="border-bottom: 0"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg></span><span class="tx"><span class="cat">Fun</span><span class="nt">[Note]</span></span><span class="amt">₪12</span></button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <div class="day"><span>Sun, Nov 8</span><span style="font-weight: 500; color: #16201A">₪62</span></div>
      <div class="box">
        <button class="row" style="border-bottom: 0"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 004 0V3M9 11v10"></path><path d="M17 3c-2 2-2 6 0 8v10"></path></svg></span><span class="tx"><span class="cat">Food</span><span class="nt">[Note]</span></span><span class="amt">₪62</span></button>
      </div>
    </section>
  </main>

  <nav aria-label="Hubs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E4E7E1; display: flex; justify-content: space-around; align-items: center; padding: 0 4px">
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
    <a href="#" aria-current="page" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #16201A; font-size: 12px; font-weight: 700"><span style="width: 64px; height: 32px; border-radius: 16px; background: #DCEFE3; color: #0F3D27; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></span>Log</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
  </nav>
</div>
</x-dc>

</body>
</html>
