<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Insights — goals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button{font-family:inherit}
.goal{width:100%;border:1px solid #E4E7E1;border-radius:18px;background:#FFFFFF;padding:14px 16px;box-sizing:border-box;text-align:left;color:#16201A;display:flex;flex-direction:column;gap:8px}
.gt{font-size:16px;font-weight:500}
.why{font-size:13px;color:#55605A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:center;gap:10px;font-size:12px;color:#55605A}
.tr{flex:1;height:8px;border-radius:4px;background:#EFF2EE;overflow:hidden;display:flex}
.chip{flex:none;height:40px;padding:0 16px;border:1px solid #D5DBD3;border-radius:20px;background:#FFFFFF;color:#16201A;font-size:14px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="padding: 28px 16px 12px 16px; display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 22px; font-weight: 500">Goals</h1>
    <span style="font-size: 12px; color: #55605A; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1F6F4A"></span>Synced just now</span>
  </header>

  <main style="padding: 0 16px 160px 16px; display: flex; flex-direction: column; gap: 10px">
    <button class="goal">
      <span class="gt">[Goal title]</span>
      <span class="why">[Why it matters]</span>
      <span class="pr"><span class="tr"><span style="width: 60%; background: #1F6F4A"></span></span>3 of 5 steps</span>
    </button>
    <button class="goal">
      <span class="gt">[Goal title]</span>
      <span class="why">[Why it matters]</span>
      <span class="pr"><span class="tr"><span style="width: 20%; background: #1F6F4A"></span></span>1 of 5 steps</span>
    </button>
    <button class="goal">
      <span class="gt">[Goal title]</span>
      <span class="pr"><span style="flex: 1">No steps yet</span><span style="color: #1F6F4A; font-weight: 500">Plan steps</span></span>
    </button>

    <section style="margin-top: 4px; background: #DCEFE3; color: #0F3D27; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Dream week</h2>
      <p style="margin: 0; font-size: 13px; line-height: 1.45">[Short line about your Dream week from WallyCalendar.]</p>
      <button style="align-self: flex-start; height: 40px; padding: 0 14px; border: 1.5px solid #1F6F4A; border-radius: 20px; background: transparent; color: #0F3D27; font-size: 13px; font-weight: 500">Coach me on my Dream week</button>
    </section>
  </main>

  <button aria-label="New goal" style="position: absolute; right: 16px; bottom: 156px; width: 56px; height: 56px; border: 0; border-radius: 18px; background: #1F6F4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22,32,26,0.25)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>

  <div role="tablist" aria-label="Insights" style="position: absolute; left: 0; right: 0; bottom: 80px; height: 60px; box-sizing: border-box; background: #F6F7F4; border-top: 1px solid #E4E7E1; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow: hidden">
    <button role="tab" aria-selected="false" class="chip">Charts</button>
    <button role="tab" aria-selected="false" class="chip">Health</button>
    <button role="tab" aria-selected="false" class="chip">Screentime</button>
    <button role="tab" aria-selected="true" class="chip" style="border: 0; background: #1F6F4A; color: #FFFFFF; font-weight: 500">Goals</button>
  </div>

  <nav aria-label="Hubs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E4E7E1; display: flex; justify-content: space-around; align-items: center; padding: 0 4px">
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></span>Log</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" aria-current="page" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #16201A; font-size: 12px; font-weight: 700"><span style="width: 64px; height: 32px; border-radius: 16px; background: #DCEFE3; color: #0F3D27; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</body>
</html>
