<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Write a journal entry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #16201A; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 20px 8px 4px 4px; display: flex; align-items: center; gap: 4px">
    <button aria-label="Close without saving" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #16201A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div style="flex: 1; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 18px; font-weight: 500">New entry</h1>
      <span style="font-size: 12px; color: #55605A">Wed, Nov 11 · 9:41 PM</span>
    </div>
  </header>

  <label for="j-text" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Journal entry</label>
  <textarea id="j-text" placeholder="What's on your mind?" style="flex: 1; margin: 8px 20px 0 20px; border: 0; outline: none; resize: none; font-size: 17px; line-height: 1.55; color: #16201A; background: transparent">[Typing here. The writing area fills the whole screen so longer entries feel comfortable. The phone keyboard opens under it.]</textarea>

  <div style="padding: 12px 16px 20px 16px; border-top: 1px solid #E4E7E1; display: flex; align-items: center; gap: 10px">
    <span style="flex: 1; font-size: 12px; color: #55605A">Draft saves if you leave</span>
    <button style="height: 52px; padding: 0 28px; border: 0; border-radius: 26px; background: #1F6F4A; color: #FFFFFF; font-size: 16px; font-weight: 500">Save</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
