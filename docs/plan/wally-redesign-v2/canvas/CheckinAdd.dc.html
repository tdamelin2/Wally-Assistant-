<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button,textarea{font-family:inherit}
.q{display:flex;flex-direction:column;gap:8px}
.ql{display:flex;justify-content:space-between;font-size:15px;font-weight:500}
.ql span{font-size:12px;font-weight:400;color:#55605A}
.sc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.n{height:48px;border:1px solid #D5DBD3;border-radius:14px;background:#FFFFFF;color:#16201A;font-size:17px;font-weight:500}
.on{border:0;background:#1F6F4A;color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(22,32,26,0.45)"></div>

  <section role="dialog" aria-label="New check-in" style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 20px 24px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #CFD6CD"></span>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 20px; font-weight: 500">New check-in</h2>
      <button style="height: 36px; padding: 0 12px; border: 1px solid #D5DBD3; border-radius: 18px; background: #FFFFFF; color: #16201A; font-size: 13px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Today</button>
    </div>

    <div class="q"><div class="ql">Mood<span>1 low · 5 great</span></div><div class="sc"><button class="n">1</button><button class="n">2</button><button class="n">3</button><button class="n on" aria-pressed="true">4</button><button class="n">5</button></div></div>
    <div class="q"><div class="ql">Energy<span>1 low · 5 high</span></div><div class="sc"><button class="n">1</button><button class="n">2</button><button class="n on" aria-pressed="true">3</button><button class="n">4</button><button class="n">5</button></div></div>
    <div class="q"><div class="ql">Sleep quality<span>1 poor · 5 great</span></div><div class="sc"><button class="n">1</button><button class="n">2</button><button class="n on" aria-pressed="true">3</button><button class="n">4</button><button class="n">5</button></div></div>
    <div class="q"><div class="ql">Stress<span>1 calm · 5 very stressed</span></div><div class="sc"><button class="n">1</button><button class="n">2</button><button class="n on" aria-pressed="true">3</button><button class="n">4</button><button class="n">5</button></div></div>

    <label for="ci-note" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #55605A">Note (optional)
      <textarea id="ci-note" rows="2" placeholder="How was today?" style="border: 1px solid #D5DBD3; border-radius: 14px; padding: 12px; font-size: 15px; color: #16201A; resize: none; background: #FFFFFF"></textarea>
    </label>

    <div style="margin-top: auto; display: flex; gap: 10px">
      <button style="height: 52px; padding: 0 20px; border: 0; border-radius: 26px; background: transparent; color: #55605A; font-size: 15px; font-weight: 500">Cancel</button>
      <button style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: #1F6F4A; color: #FFFFFF; font-size: 16px; font-weight: 500">Save check-in</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
