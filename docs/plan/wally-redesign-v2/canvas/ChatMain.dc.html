<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat — conversation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button,textarea{font-family:inherit}
.me{align-self:flex-end;max-width:78%;background:#1F6F4A;color:#FFFFFF;padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.4}
.wa{align-self:flex-start;max-width:82%;display:flex;flex-direction:column;gap:8px}
.bub{background:#FFFFFF;border:1px solid #E4E7E1;padding:10px 14px;border-radius:18px 18px 18px 4px;font-size:15px;line-height:1.4}
.pick{height:40px;padding:0 14px;border:1.5px solid #1F6F4A;border-radius:20px;background:#FFFFFF;color:#0F3D27;font-size:14px;font-weight:500}
.ic{width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:#16201A;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="padding: 20px 4px 6px 4px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #E4E7E1">
    <button class="ic" aria-label="Open chat list"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
      <h1 style="margin: 0; font-size: 17px; font-weight: 500">[Chat name]</h1>
      <span style="font-size: 12px; color: #55605A">Wally</span>
    </div>
    <button class="ic" aria-label="New chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></button>
  </header>

  <main style="padding: 16px 16px 170px 16px; display: flex; flex-direction: column; gap: 12px">
    <div class="me">add task buy milk</div>
    <div class="wa">
      <div class="bub">Done — "buy milk" is on your list for today.</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #16201A; color: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 010 10h-3"></path></svg>Undo</button>
        <span style="font-size: 12px; color: #55605A">24 s</span>
      </div>
    </div>

    <div class="me">make a study guide on calculus</div>
    <div class="wa">
      <div class="bub">You have two calculus courses. Which one?</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="pick">[Calculus I]</button><button class="pick">[Calculus II]</button></div>
    </div>

    <div class="me">[Calculus II]</div>
    <div class="wa">
      <div class="bub" aria-label="Wally is typing" style="display: flex; gap: 5px; padding: 14px 16px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #9CCBAE"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #4E9A73"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #9CCBAE"></span></div>
    </div>
  </main>

  <form style="position: absolute; left: 12px; right: 12px; bottom: 92px; margin: 0; min-height: 56px; background: #FFFFFF; border: 1px solid #E4E7E1; border-radius: 28px; display: flex; align-items: center; padding: 4px 6px 4px 18px; gap: 8px; box-shadow: 0 2px 10px rgba(22,32,26,0.08)">
    <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message Wally</label>
    <textarea id="msg" rows="1" placeholder="Message Wally…" style="flex: 1; border: 0; outline: none; resize: none; font-size: 16px; color: #16201A; background: transparent; padding: 10px 0"></textarea>
    <button type="submit" aria-label="Send" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1F6F4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
  </form>

  <nav aria-label="Hubs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E4E7E1; display: flex; justify-content: space-around; align-items: center; padding: 0 4px">
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></span>Log</a>
    <a href="#" aria-current="page" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #16201A; font-size: 12px; font-weight: 700"><span style="width: 64px; height: 32px; border-radius: 16px; background: #DCEFE3; color: #0F3D27; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
  </nav>
</div>
</x-dc>

</body>
</html>
