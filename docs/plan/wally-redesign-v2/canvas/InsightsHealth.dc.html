<html lang="en">
<head>

<title>Insights — health</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button{font-family:inherit}
.card{background:#FFFFFF;border:1px solid #E4E7E1;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.h{margin:0;font-size:15px;font-weight:500}
.sub{font-size:12px;color:#55605A}
.tile{flex:1;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tl{font-size:11px}
.tv{font-size:20px;font-weight:700}
.wk{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #EFF2EE;font-size:14px}
.chip{flex:none;height:40px;padding:0 16px;border:1px solid #D5DBD3;border-radius:20px;background:#FFFFFF;color:#16201A;font-size:14px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="padding: 28px 16px 12px 16px; display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 22px; font-weight: 500">Health</h1>
    <span style="font-size: 12px; color: #55605A">From Garmin · synced 8:02 AM</span>

      <div class="tile" style="background: #FFFFFF; border: 1px solid #E4E7E1"><span class="tl" style="color: #55605A">Resting HR</span><span class="tv">58</span></div>

    <section class="card">

        <text x="326" y="30" text-anchor="end" font-size="10" fill="#55605A">8h</text>

    <section class="card">

      <svg viewBox="0 0 326 80" width="100%" height="80" role="img" aria-label="Steps per day over the last 30 days">
        <g fill="#9CCBAE"><rect x="0" y="30" width="8" height="50" rx="2"></rect><rect x="11" y="20" width="8" height="60" rx="2"></rect><rect x="22" y="40" width="8" height="40" rx="2"></rect><rect x="33" y="25" width="8" height="55" rx="2"></rect><rect x="44" y="50" width="8" height="30" rx="2"></rect><rect x="55" y="15" width="8" height="65" rx="2"></rect><rect x="66" y="35" width="8" height="45" rx="2"></rect><rect x="77" y="28" width="8" height="52" rx="2"></rect><rect x="88" y="45" width="8" height="35" rx="2"></rect><rect x="99" y="22" width="8" height="58" rx="2"></rect><rect x="110" y="38" width="8" height="42" rx="2"></rect><rect x="121" y="30" width="8" height="50" rx="2"></rect><rect x="132" y="55" width="8" height="25" rx="2"></rect><rect x="143" y="18" width="8" height="62" rx="2"></rect><rect x="154" y="33" width="8" height="47" rx="2"></rect><rect x="165" y="27" width="8" height="53" rx="2"></rect><rect x="176" y="42" width="8" height="38" rx="2"></rect><rect x="187" y="24" width="8" height="56" rx="2"></rect><rect x="198" y="36" width="8" height="44" rx="2"></rect><rect x="209" y="20" width="8" height="60" rx="2"></rect><rect x="220" y="48" width="8" height="32" rx="2"></rect><rect x="231" y="30" width="8" height="50" rx="2"></rect><rect x="242" y="26" width="8" height="54" rx="2"></rect><rect x="253" y="40" width="8" height="40" rx="2"></rect><rect x="264" y="16" width="8" height="64" rx="2"></rect><rect x="275" y="34" width="8" height="46" rx="2"></rect><rect x="286" y="29" width="8" height="51" rx="2"></rect><rect x="297" y="44" width="8" height="36" rx="2"></rect></g>
        <rect x="308" y="26" width="8" height="54" rx="2" fill="#1F6F4A"></rect>
      </svg>
    </section>

    <section class="card">
      <h2 class="h">Workouts</h2>
      <div class="wk"><span style="width: 32px; height: 32px; border-radius: 16px; background: #DCEFE3; color: #0F3D27; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="4" r="2"></circle><path d="M8 21l3-6 3 2v4M6 12l3-3 4 1 3 3"></path></svg></span><span style="flex: 1">[Run] · Mon</span><span style="color: #55605A">32 min · 5.1 km</span></div>
    </section>
  </main>

  <div role="tablist" aria-label="Insights" style="position: absolute; left: 0; right: 0; bottom: 80px; height: 60px; box-sizing: border-box; background: #F6F7F4; border-top: 1px solid #E4E7E1; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow: hidden">
    <button role="tab" aria-selected="false" class="chip">Charts</button>
    <button role="tab" aria-selected="true" class="chip" style="border: 0; background: #1F6F4A; color: #FFFFFF; font-weight: 500">Health</button>
    <button role="tab" aria-selected="false" class="chip">Screentime</button>
    <button role="tab" aria-selected="false" class="chip">Goals</button>
  </div>

  <nav aria-label="Hubs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E4E7E1; display: flex; justify-content: space-around; align-items: center; padding: 0 4px">

    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" aria-current="page" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #16201A; font-size: 12px; font-weight: 700"><span style="width: 64px; height: 32px; border-radius: 16px; background: #DCEFE3; color: #0F3D27; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
  </nav>
</div>
