<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spending — week by category</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button{font-family:inherit}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;box-sizing:border-box;border-bottom:1px solid #E4E7E1}
.ic{width:38px;height:38px;flex:none;border-radius:19px;background:#DCEFE3;color:#0F3D27;display:flex;align-items:center;justify-content:center}
.tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.cat{font-size:15px}
.nt{font-size:12px;color:#55605A}
.amt{font-size:16px;font-weight:500}
.chip{flex:none;height:40px;padding:0 16px;border:1px solid #D5DBD3;border-radius:20px;background:#FFFFFF;color:#16201A;font-size:14px}
.lg{display:flex;align-items:center;gap:6px;font-size:13px}
.sw{width:10px;height:10px;border-radius:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="padding: 28px 16px 12px 16px; display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 22px; font-weight: 500">Spending</h1>
    <span style="font-size: 12px; color: #55605A; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1F6F4A"></span>Synced just now</span>
  </header>

  <main style="padding: 0 16px 160px 16px; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #FFFFFF; border: 1px solid #E4E7E1; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 14px; font-weight: 500; color: #55605A">This week</h2>
        <span style="font-size: 26px; font-weight: 700">₪412</span>
      </div>
      <div role="img" aria-label="This week by category: Food 168, Shopping 120, Transport 76, Bills 48" style="height: 12px; border-radius: 6px; overflow: hidden; display: flex; gap: 2px">
        <span style="width: 41%; background: #0F3D27"></span><span style="width: 29%; background: #1F6F4A"></span><span style="width: 18%; background: #4E9A73"></span><span style="width: 12%; background: #9CCBAE"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px">
        <span class="lg"><span class="sw" style="background: #0F3D27"></span>Food<span style="margin-left: auto; font-weight: 500">₪168</span></span>
        <span class="lg"><span class="sw" style="background: #1F6F4A"></span>Shopping<span style="margin-left: auto; font-weight: 500">₪120</span></span>
        <span class="lg"><span class="sw" style="background: #4E9A73"></span>Transport<span style="margin-left: auto; font-weight: 500">₪76</span></span>
        <span class="lg"><span class="sw" style="background: #9CCBAE"></span>Bills<span style="margin-left: auto; font-weight: 500">₪48</span></span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; padding: 0 4px"><h2 style="margin: 0; font-size: 15px; font-weight: 500">Today</h2><span style="font-size: 13px; color: #55605A">₪86</span></div>
      <div style="background: #FFFFFF; border: 1px solid #E4E7E1; border-radius: 16px; overflow: hidden">
        <div class="row"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 004 0V3M9 11v10"></path><path d="M17 3c-2 2-2 6 0 8v10"></path></svg></span><span class="tx"><span class="cat">Food</span><span class="nt">[Note]</span></span><span class="amt">₪48</span></div>
        <div class="row" style="border-bottom: 0"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"></rect><path d="M5 11h14M8 21l1-4M16 21l-1-4"></path></svg></span><span class="tx"><span class="cat">Transport</span><span class="nt">[Note]</span></span><span class="amt">₪38</span></div>
      </div>
    </section>

    <button style="height: 52px; border: 1.5px solid #1F6F4A; border-radius: 26px; background: transparent; color: #1F6F4A; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 103-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg>See all spending</button>
  </main>

  <button aria-label="Add spending" style="position: absolute; right: 16px; bottom: 156px; width: 56px; height: 56px; border: 0; border-radius: 18px; background: #1F6F4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22,32,26,0.25)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>

  <div role="tablist" aria-label="Log type" style="position: absolute; left: 0; right: 0; bottom: 80px; height: 60px; box-sizing: border-box; background: #F6F7F4; border-top: 1px solid #E4E7E1; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow: hidden">
    <button role="tab" aria-selected="false" class="chip">Check-ins</button>
    <button role="tab" aria-selected="true" class="chip" style="border: 0; background: #1F6F4A; color: #FFFFFF; font-weight: 500">Spending</button>
    <button role="tab" aria-selected="false" class="chip">Journal</button>
    <button role="tab" aria-selected="false" class="chip">Meals</button>
    <button role="tab" aria-selected="false" class="chip">Tasks</button>
  </div>

  <nav aria-label="Hubs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E4E7E1; display: flex; justify-content: space-around; align-items: center; padding: 0 4px">
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
    <a href="#" aria-current="page" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #16201A; font-size: 12px; font-weight: 700"><span style="width: 64px; height: 32px; border-radius: 16px; background: #DCEFE3; color: #0F3D27; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></span>Log</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
  </nav>
</div>
</x-dc>
