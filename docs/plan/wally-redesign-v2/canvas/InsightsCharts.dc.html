<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Insights — charts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F4A}a:hover{color:#0F3D27}
button{font-family:inherit}
.card{background:#FFFFFF;border:1px solid #E4E7E1;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.h{margin:0;font-size:15px;font-weight:500}
.sub{font-size:12px;color:#55605A}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#33403A}
.lg span{display:flex;align-items:center;gap:5px}
.sw{width:14px;height:3px;border-radius:2px}
.hb{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:8px;font-size:13px}
.tr{height:10px;border-radius:5px;background:#EFF2EE;overflow:hidden;display:flex}
.chip{flex:none;height:40px;padding:0 16px;border:1px solid #D5DBD3;border-radius:20px;background:#FFFFFF;color:#16201A;font-size:14px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; color: #16201A; font-family: Roboto, system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="padding: 28px 16px 12px 16px; display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 22px; font-weight: 500">Charts</h1>
    <span style="font-size: 12px; color: #55605A; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1F6F4A"></span>Synced just now</span>
  </header>

  <main style="padding: 0 16px 160px 16px; display: flex; flex-direction: column; gap: 12px">
    <section class="card">
      <div><h2 class="h">Check-ins</h2><span class="sub">Last 30 days · 1–5</span></div>
      <svg viewBox="0 0 326 120" width="100%" height="120" role="img" aria-label="Check-in scores over the last 30 days">
        <line x1="0" y1="20" x2="326" y2="20" stroke="#EFF2EE"></line><line x1="0" y1="60" x2="326" y2="60" stroke="#EFF2EE"></line><line x1="0" y1="100" x2="326" y2="100" stroke="#EFF2EE"></line>
        <polyline fill="none" stroke="#0F3D27" stroke-width="2.5" stroke-linejoin="round" points="0,50 30,40 60,45 90,30 120,40 150,35 180,25 210,40 240,30 270,28 300,35 326,30"></polyline>
        <polyline fill="none" stroke="#4E9A73" stroke-width="2.5" stroke-linejoin="round" points="0,60 30,55 60,65 90,50 120,60 150,55 180,45 210,60 240,50 270,48 300,55 326,52"></polyline>
        <polyline fill="none" stroke="#9CCBAE" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round" points="0,45 30,35 60,30 90,40 120,30 150,25 180,30 210,35 240,25 270,30 300,28 326,25"></polyline>
        <polyline fill="none" stroke="#55605A" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" points="0,80 30,85 60,75 90,90 120,80 150,85 180,92 210,78 240,88 270,90 300,85 326,88"></polyline>
      </svg>
      <div class="lg"><span><i class="sw" style="background: #0F3D27"></i>Mood</span><span><i class="sw" style="background: #4E9A73"></i>Energy</span><span><i class="sw" style="background: #9CCBAE"></i>Sleep</span><span><i class="sw" style="background: #55605A"></i>Stress</span></div>
    </section>

    <section class="card">
      <div><h2 class="h">Spending by category</h2><span class="sub">November</span></div>
      <div class="hb"><span>Food</span><span class="tr"><span style="width: 100%; background: #1F6F4A"></span></span><span style="text-align: right">₪520</span></div>
      <div class="hb"><span>Shopping</span><span class="tr"><span style="width: 62%; background: #1F6F4A"></span></span><span style="text-align: right">₪320</span></div>
      <div class="hb"><span>Transport</span><span class="tr"><span style="width: 38%; background: #1F6F4A"></span></span><span style="text-align: right">₪196</span></div>
      <div class="hb"><span>Bills</span><span class="tr"><span style="width: 24%; background: #1F6F4A"></span></span><span style="text-align: right">₪124</span></div>
    </section>

    <section class="card">
      <div><h2 class="h">Spending per month</h2><span class="sub">Last 6 months</span></div>
      <svg viewBox="0 0 326 100" width="100%" height="100" role="img" aria-label="Spending per month, last 6 months">
        <rect x="8" y="40" width="34" height="50" rx="5" fill="#9CCBAE"></rect><rect x="62" y="30" width="34" height="60" rx="5" fill="#9CCBAE"></rect><rect x="116" y="45" width="34" height="45" rx="5" fill="#9CCBAE"></rect><rect x="170" y="20" width="34" height="70" rx="5" fill="#9CCBAE"></rect><rect x="224" y="35" width="34" height="55" rx="5" fill="#9CCBAE"></rect><rect x="278" y="50" width="34" height="40" rx="5" fill="#1F6F4A"></rect>
      </svg>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); text-align: center; font-size: 11px; color: #55605A"><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span style="color: #16201A; font-weight: 700">Nov</span></div>
    </section>
  </main>

  <div role="tablist" aria-label="Insights" style="position: absolute; left: 0; right: 0; bottom: 80px; height: 60px; box-sizing: border-box; background: #F6F7F4; border-top: 1px solid #E4E7E1; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow: hidden">
    <button role="tab" aria-selected="true" class="chip" style="border: 0; background: #1F6F4A; color: #FFFFFF; font-weight: 500">Charts</button>
    <button role="tab" aria-selected="false" class="chip">Health</button>
    <button role="tab" aria-selected="false" class="chip">Screentime</button>
    <button role="tab" aria-selected="false" class="chip">Goals</button>
  </div>

  <nav aria-label="Hubs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E4E7E1; display: flex; justify-content: space-around; align-items: center; padding: 0 4px">
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>Today</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></span>Log</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg></span>Chat</a>
    <a href="#" aria-current="page" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #16201A; font-size: 12px; font-weight: 700"><span style="width: 64px; height: 32px; border-radius: 16px; background: #DCEFE3; color: #0F3D27; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Insights</a>
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55605A; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></span>Browse</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
